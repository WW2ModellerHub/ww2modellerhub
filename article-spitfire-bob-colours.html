  <h1 class="art-title">Spitfire Battle of Britain camouflage — paint codes across four brands</h1>
  <div class="art-meta"><span>WW2 Modeller Hub</span><span>2025</span><span>6 min read</span></div>
<p class="art-intro">Every Spitfire in the Battle of Britain wore an identical upper-surface camouflage scheme: Dark Earth and Dark Green in a disruptive pattern, with Sky on the undersides, spinner and fuselage band. The colours were MAP (Ministry of Aircraft Production) standards — the same as the Hurricane. What differs is the split line: the Spitfire's curved fuselage creates a more complex, wavy demarcation that is one of the most distinctive features of a BoB build.</p>

<h2>The scheme — A and B</h2>
<p>Unlike many aircraft, the BoB Spitfire had two mirror-image camouflage schemes — A and B — applied alternately to successive aircraft off the production line. In the A scheme, Dark Brown (Dark Earth) appears on the starboard side of the nose; in the B scheme, it appears on the port side. This is visible from below and from ahead. Before building, identify which scheme your chosen aircraft wore — photographs of the specific serial or code letters are the only reliable source.</p>

<div class="tip-box">
<div class="tip-label">Common error</div>
Many modellers apply whichever scheme the kit decals show without checking the actual aircraft. This is particularly important for well-documented subjects like ZP-K (Malan, 74 Sqn) and QJ-K (Tuck, 92 Sqn) — both of which are covered by multiple decal sheets that don't always agree.
</div>

<h2>The three colours</h2>

<div class="colour-card">
<div class="cc-swatch" style="background:#5c3d1e">
<div class="cc-raf-name">Dark Earth</div>
<div class="cc-hex">MAP Dark Earth · approx #5c3d1e</div>
</div>
<div class="cc-body">
<p style="margin-bottom:.8rem;font-size:16px">The warm brown. On the Spitfire's A scheme, this appears on the port side of the upper fuselage and dominates the port upper wing. In the B scheme, the positions reverse. It is a genuine earth tone — not reddish, not sandy — and should look distinctly warm against the cool Dark Green.</p>
<div class="codes-grid">
<div class="code-row"><div class="cr-brand">Humbrol</div><div class="cr-code">No.29</div><div class="cr-name">Dark Earth (Matt)</div></div>
<div class="code-row"><div class="cr-brand">Tamiya Acrylic</div><div class="cr-code">XF-52</div><div class="cr-name">Flat Earth</div></div>
<div class="code-row"><div class="cr-brand">Vallejo MC</div><div class="cr-code">70.871</div><div class="cr-name">Leather Brown</div></div>
<div class="code-row"><div class="cr-brand">AK Interactive</div><div class="cr-code">AK2071</div><div class="cr-name">RAF Dark Earth</div></div>
</div>
</div>
</div>

<div class="colour-card">
<div class="cc-swatch" style="background:#2d4a1e">
<div class="cc-raf-name">Dark Green</div>
<div class="cc-hex">MAP Dark Green · approx #2d4a1e</div>
</div>
<div class="cc-body">
<p style="margin-bottom:.8rem;font-size:16px">Cool, deep green — the other half of the disruptive pattern. Should read noticeably darker than the Dark Earth. At scale, both colours benefit from subtle lightening of around 5–10% to compensate for the scale effect. Pre-shading with near-black along panel lines adds depth that the real aircraft achieves through natural variation in the paintwork.</p>
<div class="codes-grid">
<div class="code-row"><div class="cr-brand">Humbrol</div><div class="cr-code">No.30</div><div class="cr-name">Dark Green (Matt)</div></div>
<div class="code-row"><div class="cr-brand">Tamiya Acrylic</div><div class="cr-code">XF-61</div><div class="cr-name">Dark Green</div></div>
<div class="code-row"><div class="cr-brand">Vallejo MC</div><div class="cr-code">70.893</div><div class="cr-name">US Dark Green</div></div>
<div class="code-row"><div class="cr-brand">AK Interactive</div><div class="cr-code">AK2069</div><div class="cr-name">RAF Dark Green</div></div>
</div>
</div>
</div>

<div class="colour-card">
<div class="cc-swatch" style="background:#8db99a">
<div class="cc-raf-name">Sky (Type S)</div>
<div class="cc-hex">MAP Sky Type S · approx #8db99a</div>
</div>
<div class="cc-body">
<p style="margin-bottom:.8rem;font-size:16px">Sky is a pale, slightly warm grey-green — not blue, not grey. Used on the undersides of all BoB Spitfires, plus the spinner, fuselage code letters and fuselage band. Some Spitfire spinners carried a narrow black spiral stripe on the Sky — check references for specific aircraft. Humbrol 90 is the standard reference for Sky and has remained consistent for decades.</p>
<div class="codes-grid">
<div class="code-row"><div class="cr-brand">Humbrol</div><div class="cr-code">No.90</div><div class="cr-name">Beige Green (Sky)</div></div>
<div class="code-row"><div class="cr-brand">Tamiya Acrylic</div><div class="cr-code">XF-21</div><div class="cr-name">Sky</div></div>
<div class="code-row"><div class="cr-brand">Vallejo MC</div><div class="cr-code">70.900</div><div class="cr-name">French Mirage Blue</div></div>
<div class="code-row"><div class="cr-brand">AK Interactive</div><div class="cr-code">AK2072</div><div class="cr-name">RAF Sky Type S</div></div>
</div>
</div>
</div>

<div class="colour-card">
<div class="cc-swatch" style="background:#4a6b47">
<div class="cc-raf-name">Interior Grey-Green (Cockpit)</div>
<div class="cc-hex">RAF Interior Green DTD 224 · approx #4a6b47</div>
</div>
<div class="cc-body">
<p style="margin-bottom:.8rem;font-size:16px">The entire Spitfire cockpit interior, instrument panel surround, seat back, sidewalls, wheel bays and undercarriage legs were Interior Grey-Green. This is a cool mid-tone that reads slightly greener than it looks in the tin — the scale effect makes it appear lighter than the real thing, so avoid further lightening it.</p>
<div class="codes-grid">
<div class="code-row"><div class="cr-brand">Humbrol</div><div class="cr-code">No.78</div><div class="cr-name">Cockpit Green (Matt)</div></div>
<div class="code-row"><div class="cr-brand">Tamiya Acrylic</div><div class="cr-code">XF-71</div><div class="cr-name">Cockpit Green</div></div>
<div class="code-row"><div class="cr-brand">Vallejo MC</div><div class="cr-code">70.886</div><div class="cr-name">Green Grey</div></div>
<div class="code-row"><div class="cr-brand">AK Interactive</div><div class="cr-code">AK2073</div><div class="cr-name">RAF Interior Green</div></div>
</div>
</div>
</div>

<h2>Roundels and codes</h2>
<p>All BoB Spitfires carried Type A1 roundels on the fuselage (red, white, blue — no yellow outer ring) and Type A on the upper wings. The lower wing roundels were Type B (red and blue only, no white). Fin flash was full-width. Sky code letters at approximately 24-inch height. Serial number in black on the port rear fuselage.</p>
<p>By October 1940, yellow outer rings on fuselage roundels were appearing on newly delivered aircraft; older machines in service retained the original Type A1. Check the delivery date of your specific subject if modelling a late-battle aircraft.</p>

<div class="tip-box">
<div class="tip-label">Applying the camouflage split line</div>
The Spitfire's split line curves under the cockpit at a diagonal — it is not a straight edge or a simple horizontal. The line runs from roughly one-third down the fuselage depth at the wing root, rising to about halfway up the fuselage at the fin. Use photographs of AR501 at Shuttleworth or the IWM archive for the exact angle on your chosen aircraft.
</div>

<p>For interactive colour chip comparisons and weathering notes by airfield, see the <a href="spitfire_paradise.html?tab=build">Spitfire reference page</a>.</p>
