  <h1 class="art-title">The 22 Hurricane squadrons of the Battle of Britain — a guide for modellers</h1>
  <div class="art-meta"><span>WW2 Modeller Hub</span><span>2025</span><span>12 min read</span></div>
<p class="art-intro">Twenty-two RAF squadrons flew Hawker Hurricanes in the Battle of Britain, accounting for over 55% of all RAF victory claims. Understanding which squadron you're modelling — its group, base, codes and pilots — is the foundation of any serious BoB Hurricane build. This guide maps all 22 units with the key details a modeller needs.</p>

<h2>The group system</h2>
<p>Fighter Command was divided into Groups, each covering a geographic area. The group your squadron belonged to determines its role in the battle, its likely flying tempo and the airfield mud colour you should apply to the undercarriage.</p>
<ul>
<li><strong>11 Group</strong> (AVM Keith Park) — Southeast England, the front line. The most heavily engaged. Squadrons here flew 4–6 sorties per day in August–September. Heavy wear on aircraft.</li>
<li><strong>10 Group</strong> (AVM Quintin Brand) — Southwest. Covered Portsmouth, Southampton and Bristol. Less intense than 11 Group but engaged Luftflotte 3 from Normandy.</li>
<li><strong>12 Group</strong> (AVM Trafford Leigh-Mallory) — Midlands. The Big Wing controversy. Reserve role, rotating south when called. Less operational wear on aircraft.</li>
<li><strong>13 Group</strong> (AVM Richard Saul) — North. Scotland, North England. Defeated the disastrous Luftflotte 5 Norway attacks on 15 August.</li>
</ul>

<h2>The 11 Group Hurricane squadrons</h2>
<p>These units bore the heaviest burden of the battle. Their aircraft showed the greatest operational wear — paint fading, retouched codes, heavy exhaust staining, accumulated airfield contamination.</p>

<h3>No. 1 Squadron — JX — Northolt</h3>
<p>One of the most experienced units, blooded in France. 155 claims — third highest in the battle. The most covered Hurricane unit for decals: Xtradecal X48147, X72113 and multiple Barracuda sheets. Serial P2923 coded JX-B is the standard reference aircraft.</p>

<h3>No. 32 Squadron — GZ — Biggin Hill</h3>
<p>Officially the most successful Fighter Command squadron in the first half of the battle. Michael Crossley (22 kills — top Hurricane ace of 1940) and Peter Brothers flew here. The Hawkinge B-Flight photograph (29 July 1940) showing GZ-V is the most reproduced image of the entire battle. Xtradecal X72117 covers this unit.</p>

<h3>No. 43 Squadron — FT — Tangmere</h3>
<p>First to intercept cross-Channel raids on the south coast. Tom Dalton-Morgan (11 kills) was among the top Hurricane scorers. Xtradecal X48147 and X72117 both cover 43 Sqn.</p>

<h3>No. 56 Squadron — US — North Weald</h3>
<p>Defended eastern Essex. North Weald was bombed on 24 August. Xtradecal X72117 covers N3522 US-P. Serial N3522 coded US-P is the primary reference aircraft.</p>

<h3>No. 85 Squadron — VY — Croydon/Castle Camps</h3>
<p>Peter Townsend (DSO DFC) led 85 Sqn. R.H.A. Lee (13 kills) was the highest-scoring pilot at the time of his death on 18 August. Multiple decal sheets: Xtradecal X72225 (P3166 VY-Q Townsend), X72117 (VY-R A.G. Lewis). Croydon was bombed 15 August.</p>

<h3>No. 111 Squadron — JU — Croydon</h3>
<p>Pioneered head-on attacks against bomber formations — adopted across Fighter Command. 134 claims — highest of any Hurricane unit. Xtradecal X48147 covers this unit.</p>

<h3>No. 501 Squadron — SD — Kenley</h3>
<p>County of Gloucester Auxiliary. 131 claims. 'Ginger' Lacey scored 15 kills here before moving to 151 Sqn. Xtradecal X72225 covers V6665 SD-B.</p>

<h2>The 10 Group Hurricane squadrons</h2>

<h3>No. 87 Squadron — LK — Exeter</h3>
<p>The unique Red Devon Clay station — see the weathering article for details. Ian Gleed wrote 'Arise to Conquer'. Xtradecal X48144 covers P2798 LK-A (Gleed's aircraft).</p>

<h3>No. 238 Squadron — VK — Middle Wallop</h3>
<p>Covered Hampshire and Dorset for 10 Group. Engaged Luftflotte 3 attacks on Southampton and Weymouth.</p>

<h2>The 12 Group Hurricane squadrons</h2>

<h3>No. 242 Squadron — LE — Coltishall</h3>
<p>The 'Canadian Squadron' under Bader. Anchor of the Big Wing controversy. V7467 LE-D (Bader's aircraft) is the most modelled Big Wing Hurricane. Xtradecal X48144, X72225 and X48146 all cover 242 Sqn markings.</p>

<h3>No. 249 Squadron — GN — Church Fenton</h3>
<p>Tom Neil's squadron — his memoir Gun Button to Fire is the finest first-person Hurricane account of the battle. Nicholson's VC was won here (16 August 1940). Serial P3616 coded GN-F.</p>

<h3>No. 310 Squadron — NN — Duxford</h3>
<p>The first Czech RAF squadron. Duxford Wing participant. AML produces dedicated Czech squadron decal sets with great accuracy. Xtradecal X48144 covers P3143 NN-D.</p>

<h2>The 13 Group Hurricane squadrons</h2>

<h3>No. 605 Squadron — UP — Drem/Croydon</h3>
<p>County of Warwick Auxiliary. Archie McKellar (21 kills — Scotland's greatest fighter ace) flew here. He was killed 1 November 1940, just after the battle closed officially.</p>

<h3>No. 607 Squadron — AF — Usworth</h3>
<p>County of Durham Auxiliary. The crucial 15 August engagement against Luftflotte 5 from Norway — met by 13 Group and inflicted catastrophic losses, ending large-scale Scandinavian raids permanently.</p>

<h2>Decal sheets — quick reference</h2>
<p>For a comprehensive decal guide, use the Squadrons tab on the <a href="hurricane_paradise.html">Hurricane reference page</a> — each squadron card lists specific Hannants and Barracuda product codes. The most versatile single sheets are:</p>
<ul>
<li>Xtradecal X48144 — 1:48 Hurricane BoB Part 1 (87, 242, 310 Sqns)</li>
<li>Xtradecal X48146 — 1:48 Hurricane BoB Part 2 (242, 501, 601 Sqns)</li>
<li>Xtradecal X48147 — 1:48 National Insignia (roundels, codes all squadrons)</li>
<li>Xtradecal X72225 — 1:72 Hurricane BoB Part 2 (85, 242, 504, 601, 607 Sqns)</li>
</ul>
