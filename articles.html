function filterArticles(cat, btn) {
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('[data-cats]').forEach(card => {
    card.style.display = (cat === 'all' || card.dataset.cats.includes(cat)) ? '' : 'none';
  });
  // Featured card spans full width only when visible
  const fc = document.querySelector('.featured-card');
  if (fc && fc.style.display !== 'none') fc.style.gridColumn = '1/-1';
}
</script>
</body>
</html>
