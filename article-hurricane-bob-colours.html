  <h1 class="art-title">Hurricane Battle of Britain camouflage — paint codes across four brands</h1>
  <div class="art-meta"><span>WW2 Modeller Hub</span><span>2025</span><span>5 min read</span></div>
  <p class="art-intro">Every Hawker Hurricane flying in the Battle of Britain wore the same three-colour camouflage scheme: Dark Earth and Dark Green on the upper surfaces, Sky on the undersides. The exact shades varied between manufacturers and have faded on surviving aircraft, but official MAP (Ministry of Aircraft Production) documents give us a solid starting point. Here are the best matched codes across the four major model paint brands.</p>

  <h2>The three colours</h2>

  <div class="colour-card">
    <div class="cc-swatch" style="background:#5c3d1e">
      <div class="cc-raf-name">Dark Earth</div>
      <div class="cc-hex">RAF reference: MAP Dark Earth · approx #5c3d1e</div>
    </div>
    <div class="cc-body">
      <p style="margin-bottom:.8rem;font-size:16px">The warm brown that covered roughly half of the upper surfaces. In 1940, this was a genuine earth-brown — not the redder, warmer tone that appears in some later schemes. Study photographs of surviving airworthy examples like R4118 for the most accurate reference in natural light.</p>
      <div class="codes-grid">
        <div class="code-row"><div class="cr-brand">Humbrol</div><div class="cr-code">No.29</div><div class="cr-name">Dark Earth (Matt)</div></div>
        <div class="code-row"><div class="cr-brand">Tamiya Acrylic</div><div class="cr-code">XF-52</div><div class="cr-name">Flat Earth</div></div>
        <div class="code-row"><div class="cr-brand">Vallejo MC</div><div class="cr-code">70.871</div><div class="cr-name">Leather Brown</div></div>
        <div class="code-row"><div class="cr-brand">AK Interactive</div><div class="cr-code">AK2071</div><div class="cr-name">RAF Dark Earth</div></div>
      </div>
    </div>
  </div>

  <div class="colour-card">
    <div class="cc-swatch" style="background:#2d4a1e">
      <div class="cc-raf-name">Dark Green</div>
      <div class="cc-hex">RAF reference: MAP Dark Green · approx #2d4a1e</div>
    </div>
    <div class="cc-body">
      <p style="margin-bottom:.8rem;font-size:16px">The deeper, cooler green that completed the disruption pattern. In scale, this colour should feel distinctly darker than the Dark Earth — the tonal contrast was intentional. Fading in sunlight shifts both colours toward warmer, paler tones over a flying season.</p>
      <div class="codes-grid">
        <div class="code-row"><div class="cr-brand">Humbrol</div><div class="cr-code">No.30</div><div class="cr-name">Dark Green (Matt)</div></div>
        <div class="code-row"><div class="cr-brand">Tamiya Acrylic</div><div class="cr-code">XF-61</div><div class="cr-name">Dark Green</div></div>
        <div class="code-row"><div class="cr-brand">Vallejo MC</div><div class="cr-code">70.893</div><div class="cr-name">US Dark Green</div></div>
        <div class="code-row"><div class="cr-brand">AK Interactive</div><div class="cr-code">AK2069</div><div class="cr-name">RAF Dark Green</div></div>
      </div>
    </div>
  </div>

  <div class="colour-card">
    <div class="cc-swatch" style="background:#8db99a">
      <div class="cc-raf-name">Sky (Type S)</div>
      <div class="cc-hex">RAF reference: MAP Sky / DTD Sky Type S · approx #8db99a</div>
    </div>
    <div class="cc-body">
      <p style="margin-bottom:.8rem;font-size:16px">Sky is the underside colour that gives the BoB Hurricane its distinctive pale green-grey tone. It is not blue, not grey, and emphatically not white. Humbrol's No.90 is the standard reference. The spinner and fuselage band were also Sky. Some late-1940 Hurricanes switched to Duck Egg Blue on the undersides — this appears on some decal sheet options and should be treated as a variant rather than the standard.</p>
      <div class="codes-grid">
        <div class="code-row"><div class="cr-brand">Humbrol</div><div class="cr-code">No.90</div><div class="cr-name">Beige Green (Sky)</div></div>
        <div class="code-row"><div class="cr-brand">Tamiya Acrylic</div><div class="cr-code">XF-21</div><div class="cr-name">Sky</div></div>
        <div class="code-row"><div class="cr-brand">Vallejo MC</div><div class="cr-code">70.900</div><div class="cr-name">French Mirage Blue</div></div>
        <div class="code-row"><div class="cr-brand">AK Interactive</div><div class="cr-code">AK2072</div><div class="cr-name">RAF Sky Type S</div></div>
      </div>
    </div>
  </div>

  <h2>Interior colour</h2>
  <div class="colour-card">
    <div class="cc-swatch" style="background:#4a6b47">
      <div class="cc-raf-name">Interior Green (Cockpit)</div>
      <div class="cc-hex">RAF reference: Interior Green DTD 224 · approx #4a6b47</div>
    </div>
    <div class="cc-body">
      <p style="margin-bottom:.8rem;font-size:16px">The inside of the Hurricane cockpit was painted Interior Green — a mid-tone grey-green used throughout RAF aircraft of the period. All instruments, panels, seat back and sidewalls were this colour. The Sutton harness was natural cotton canvas.</p>
      <div class="codes-grid">
        <div class="code-row"><div class="cr-brand">Humbrol</div><div class="cr-code">No.78</div><div class="cr-name">Cockpit Green (Matt)</div></div>
        <div class="code-row"><div class="cr-brand">Tamiya Acrylic</div><div class="cr-code">XF-71</div><div class="cr-name">Cockpit Green (IJN)</div></div>
        <div class="code-row"><div class="cr-brand">Vallejo MC</div><div class="cr-code">70.886</div><div class="cr-name">Green Grey</div></div>
        <div class="code-row"><div class="cr-brand">AK Interactive</div><div class="cr-code">AK2073</div><div class="cr-name">RAF Interior Green</div></div>
      </div>
    </div>
  </div>

  <h2>Application tips</h2>

  <div class="tip-box">
    <div class="tip-label">Camouflage demarcation</div>
    The boundary between Dark Earth and Dark Green on BoB Hurricanes was a soft-edge spray pattern, not a hard masked line. Use post-shade oil dot filtering or freehand airbrush to achieve the soft, feathered boundary. Study photographs of R4118 and similar survivors — the real demarcation is far softer than many models show.
  </div>

  <div class="tip-box">
    <div class="tip-label">Pre-shading</div>
    Both dark colours benefit from a black pre-shade on panel lines and a slightly lighter post-shade highlight along raised details. The Dark Green in particular tends to look flat without this treatment. Use a 70:30 mix of the base colour with XF-2 or equivalent white for highlights.
  </div>

  <div class="tip-box">
    <div class="tip-label">Fading and weathering</div>
    BoB Hurricanes had a short service life — weeks, not months — so fading should be subtle. A single session of carefully applied oil dot filtering using raw umber and yellow ochre is typically sufficient. The Sky undersides weather to a slightly greenish-grey; adding a touch of white and grey to your filter will replicate this.
  </div>

  <p>For interactive colour chip comparisons, build steps with product links, and weathering recipes by specific airfield, visit the <a href="hurricane_paradise.html?tab=build">Hurricane reference page</a>.</p>
